<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <div class="logo-box">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 4H13V19H21V4Z" opacity="0.3"/>
                <path d="M12 5.5C11.12 4.56 9.84 4 8.5 4C6.5 4 4.5 5.5 4.5 8V19.5C4.5 19.78 4.72 20 5 20C5.07 20 5.15 19.98 5.22 19.95C6.18 19.53 7.42 19 8.5 19C10.28 19 11.45 19.83 12 20.5C12.55 19.83 13.72 19 15.5 19C16.58 19 17.82 19.53 18.77 19.95C18.85 19.98 18.93 20 19 20C19.28 20 19.5 19.78 19.5 19.5V8C19.5 5.5 17.5 4 15.5 4C14.16 4 12.88 4.56 12 5.5ZM18 17.5C17.07 17.15 16.03 17 15.5 17C14.01 17 12.79 17.69 12 18.33V7.5C12.67 6.64 13.9 6 15.5 6C16.92 6 18 7.08 18 8.5V17.5Z"/>
            </svg>
        </div>

        <h2>Bem-vindo de volta</h2>
        <p class="subtitle">Acesse sua conta para continuar</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail ou Matrícula</label>
                <div class="input-wrapper">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <input type="text" id="email" placeholder="seu@email.com">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    
                    <input type="password" id="password" placeholder="Sua senha">
                    
                    <button type="button" class="toggle-password">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="forgot-password-wrapper">
                <a href="contato.html" class="forgot-password">Esqueci a senha</a>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <p class="footer-text">Ainda não tem uma conta? <a href="#">Criar conta</a></p>
    </main>


    <div class="help-button">?</div>

    <script>
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert('Por favor, preencha e-mail e senha.');
                return;
            }

            // Simula autenticação simples: salva token e redireciona para a página inicial
            try {
                localStorage.setItem('authToken', btoa(email + ':' + password));
            } catch (err) {
                console.warn('Falha ao salvar token:', err);
            }

            window.location.href = 'inicio.html';
        });

        // Toggle password visibility
        const toggleBtn = document.querySelector('.toggle-password');
        const pwdInput = document.getElementById('password');
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener('click', () => {
                const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
                pwdInput.setAttribute('type', type);
            });
        }
    </script>

</body>
</html>
